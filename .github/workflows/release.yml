name: Release

# Pushing a tag like v0.2.0 builds signed APKs and an unsigned IPA and
# attaches them to a draft release. Notes are written and the release is
# published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # Public certificate fingerprint (PLAN §9). The build fails if the APKs are
  # signed with anything else, e.g. the debug-key fallback in build.gradle.kts.
  CERT_SHA256: a17a660bca65d7bb89d6f307aba46106f3f8afcb90f5d0b3ec40eb286d7179e2

jobs:
  android:
    name: Build and sign Android APKs
    runs-on: ubuntu-latest
    # Signing secrets live in this environment, restricted to v* tags.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret for $name is not set"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter build apk --release --split-per-abi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

      - name: Verify signing certificate
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$digest" != "$CERT_SHA256" ]; then
              echo "::error::$apk is signed with $digest, expected $CERT_SHA256"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: users sign it themselves (docs/ios-sideload.md).
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry maxbo-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/maxbo-unsigned.ipa
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum app-*-release.apk maxbo-unsigned.ipa > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Draft created by CI. Write the release notes before publishing." \
            app-*-release.apk maxbo-unsigned.ipa SHA256SUMS.txt
