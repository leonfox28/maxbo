name: Release

# Pushing a tag like v0.12.0 builds the signed APK and attaches it to a draft
# release. Notes are written and the release is published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Public certificate fingerprint (PLAN §9). The build fails if the APK is
  # signed with anything else, e.g. the debug-key fallback in
  # app/build.gradle.kts.
  CERT_SHA256: a17a660bca65d7bb89d6f307aba46106f3f8afcb90f5d0b3ec40eb286d7179e2

jobs:
  android:
    name: Build and sign the Android APK
    runs-on: ubuntu-latest
    # Signing secrets live in this environment, restricted to v* tags.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - run: ./gradlew spotlessCheck lint testDebugUnitTest

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret for $name is not set"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: ./gradlew assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" key.properties

      - name: Verify signing certificate
        run: |
          set -o pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          # build-tools 37 prints "V2 Signer: certificate SHA-256 digest:",
          # older ones "Signer #1 certificate SHA-256 digest:". Every signer
          # must be ours.
          digests=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$digests" != "$CERT_SHA256" ]; then
            echo "::error::$apk is signed with '${digests//$'\n'/ }', expected $CERT_SHA256"
            exit 1
          fi
          mkdir dist
          cp "$apk" "dist/maxbo-$GITHUB_REF_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/maxbo-*.apk
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum maxbo-*.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Draft created by CI. Write the release notes before publishing." \
            maxbo-*.apk SHA256SUMS.txt
